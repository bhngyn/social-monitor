name: Release (GHCR images)

# Builds and pushes Social Monitor's two container images to GHCR on a semver tag.
# Consumed by the Investigation Tool Bundle (https://github.com/bhngyn/investigation-tool-bundle).
# The bundle's compose file references both images with the same IMAGE_TAG, so this
# workflow publishes them together under a single git tag.
#
# Trigger: git tag vX.Y.Z && git push --tags
# Outputs:
#   ghcr.io/bhngyn/social-monitor-api:vX.Y.Z + :latest   (built from ./backend)
#   ghcr.io/bhngyn/social-monitor-web:vX.Y.Z + :latest   (built from ./frontend)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.2.3). Used only for manual runs."
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      # If one image build fails, still try the other — easier to diagnose.
      fail-fast: false
      matrix:
        include:
          - image: social-monitor-api
            context: ./backend
          - image: social-monitor-web
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ inputs.tag }}" >>"$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >>"$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/bhngyn/${{ matrix.image }}:${{ steps.ver.outputs.version }}
            ghcr.io/bhngyn/${{ matrix.image }}:latest
          # Per-image cache scope so the api + web builds don't clobber each other.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
